<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Parfüm kartviziti</title>
<style>
/* A shared card. Everything it shows comes from the part of the address after "#": nothing is stored or fetched except the bottle pictures. */
:root{--bg:#17110d;--panel:#211812;--fg:#f8ede3;--muted:#b49d8b;--accent:#f26d21;--ink:#2a1407}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.vcard{position:relative;isolation:isolate;overflow:hidden;width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;padding:24px 20px 16px;border-radius:30px;background:var(--panel);
  box-shadow:0 30px 60px -34px rgb(0 0 0 / .6)}
.vcard::before{content:"";position:absolute;z-index:-1;right:-32%;top:-30%;width:92%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 34%,transparent),transparent)}
.top{display:flex;align-items:center;gap:14px}
.av{width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--ink);font-weight:700;font-size:26px}
.id{display:flex;flex-direction:column;gap:3px;min-width:0}
.name{font-size:27px;font-weight:650;line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.title{font-size:14px;color:var(--muted);line-height:1.3}
.bio{margin:0;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.perf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.p{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.p .art{width:100%;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#fff;display:grid;place-items:center;color:#888;font-weight:700;font-size:22px}
.p .art img{width:100%;height:100%;object-fit:cover;display:block}
.p span{font-size:12.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p small{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.link{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:10px;align-items:center;min-height:52px;padding:8px 12px 8px 8px;border-radius:16px;
  background:color-mix(in srgb,var(--fg) 9%,transparent);color:var(--fg);text-decoration:none;min-width:0}
.link:last-child:nth-child(odd){grid-column:1 / -1}
.link i{grid-row:1 / span 2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);font-style:normal;font-weight:800;font-size:11px}
.link span{font-size:14px;font-weight:600;line-height:1.2}
.link small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.foot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);letter-spacing:.04em;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--fg) 12%,transparent)}
.note{max-width:420px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.note a{color:var(--accent)}
.empty{max-width:420px;text-align:center;line-height:1.6;color:var(--muted)}
</style>
</head>
<body>
<main id="root"></main>
<p class="note" id="note" hidden>Bu kart <a href="./">BB Parfüm Envanteri</a> ile hazırlandı. Bağlantıya dokunmadan önce adresi kontrol et: kartı hazırlayan kişinin yazdığı adrestir.</p>
<script>
(() => {
'use strict';
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const root = document.getElementById('root');
const fail = () => { root.appendChild(el('p', 'empty', 'Bu bağlantıda okunabilir bir kartvizit yok. Bağlantının tamamını kopyaladığından emin ol.')); };
// the same link kinds the app offers; an address is always built here from a user name, never taken ready-made (except an https web site)
const handle = base => v => { const h = String(v).trim().replace(/^https?:\/\/[^/]+\//i, '').replace(/^@/, '').replace(/[/?#].*$/, ''); return /^[\w.\-]{1,40}$/.test(h) ? base + h : ''; };
const LINKS = {
  instagram: ['Instagram', 'IG', handle('https://instagram.com/')], tiktok: ['TikTok', 'TT', handle('https://www.tiktok.com/@')], x: ['X', 'X', handle('https://x.com/')],
  youtube: ['YouTube', 'YT', handle('https://www.youtube.com/@')], facebook: ['Facebook', 'f', handle('https://www.facebook.com/')], telegram: ['Telegram', 'TG', handle('https://t.me/')],
  whatsapp: ['WhatsApp', 'WA', v => { const d = String(v).replace(/\D/g, ''); return d.length >= 8 && d.length <= 15 ? 'https://wa.me/' + d : ''; }],
  mail: ['E-posta', '@', v => /^[^\s@<>"'`]+@[^\s@<>"'`]+\.[a-z]{2,}$/i.test(String(v).trim()) ? 'mailto:' + String(v).trim() : ''],
  web: ['Web sitesi', 'www', v => { try { const t = String(v).trim(), u = new URL(/^https?:\/\//i.test(t) ? t.replace(/^http:/i, 'https:') : 'https://' + t); return t && u.protocol === 'https:' && u.hostname.includes('.') ? u.href : ''; } catch (e) { return ''; } }]
};
let d;
try {
  const raw = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
  if (!raw || raw.length > 6000) throw 0;
  const bin = atob(raw), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || typeof d !== 'object') throw 0;
} catch (e) { fail(); return; }
const str = (v, n) => typeof v === 'string' ? v.slice(0, n) : '';
// colours of the theme the card was made in; anything that is not a plain #rrggbb is ignored
if (Array.isArray(d.c)) ['--bg', '--panel', '--fg', '--muted', '--accent', '--ink'].forEach((k, i) => { if (/^#[0-9a-f]{6}$/i.test(d.c[i] || '')) document.documentElement.style.setProperty(k, d.c[i]); });
const name = str(d.n, 60).trim(), title = str(d.t, 80).trim(), bio = str(d.b, 240).trim();
const cardEl = el('article', 'vcard');
const top = el('div', 'top');
top.appendChild(el('div', 'av', ((name || 'BB').split(/\s+/).slice(0, 2).map(w => w.charAt(0).toUpperCase()).join(''))));
const id = el('div', 'id'); id.appendChild(el('b', 'name', name || 'Kartvizit')); if (title) id.appendChild(el('span', 'title', title));
top.appendChild(id); cardEl.appendChild(top);
if (bio) cardEl.appendChild(el('p', 'bio', bio));
const perf = (Array.isArray(d.p) ? d.p : []).slice(0, 6).filter(x => Array.isArray(x) && typeof x[0] === 'string' && x[0].trim());
if (perf.length) {
  cardEl.appendChild(el('span', 'label', 'İmza kokularım'));
  const g = el('div', 'perf');
  for (const x of perf) {
    const p = el('div', 'p'), a = el('div', 'art', str(x[0], 60).trim().charAt(0).toUpperCase());
    const cid = Number(x[2]);
    if (Number.isInteger(cid) && cid > 0 && cid < 1e7) {
      const im = new Image(); im.alt = ''; im.referrerPolicy = 'no-referrer';
      im.onload = () => { a.textContent = ''; a.appendChild(im); };
      im.src = 'https://fimgs.net/mdimg/perfume/375x500.' + cid + '.jpg';
    }
    p.appendChild(a); p.appendChild(el('span', '', str(x[0], 60))); p.appendChild(el('small', '', str(x[1], 40)));
    g.appendChild(p);
  }
  cardEl.appendChild(g);
}
const links = (Array.isArray(d.l) ? d.l : []).slice(0, 8).map(x => Array.isArray(x) && Object.prototype.hasOwnProperty.call(LINKS, x[0]) ? [LINKS[x[0]], str(x[1], 80)] : null).filter(Boolean)
  .map(([k, v]) => [k, v, k[2](v)]).filter(x => x[2]);
if (links.length) {
  const g = el('div', 'links');
  for (const [k, v, url] of links) {
    const a = el('a', 'link'); a.href = url; a.rel = 'noopener noreferrer nofollow'; if (/^https:/.test(url)) a.target = '_blank';
    a.appendChild(el('i', '', k[1])); a.appendChild(el('span', '', k[0]));
    // what is shown is the real destination, so a link cannot pretend to go somewhere else
    a.appendChild(el('small', '', k[1] === 'www' ? new URL(url).hostname : k[1] === '@' || k[1] === 'WA' ? v.trim() : '@' + v.trim().replace(/^@/, '')));
    g.appendChild(a);
  }
  cardEl.appendChild(g);
}
const foot = el('div', 'foot'); foot.appendChild(el('span', '', 'BB Parfüm Envanteri'));
if (Array.isArray(d.s) && Number.isFinite(+d.s[0])) foot.appendChild(el('span', '', (+d.s[0] | 0) + ' parfüm · ' + (+d.s[1] | 0) + ' şişe'));
cardEl.appendChild(foot);
root.appendChild(cardEl);
document.getElementById('note').hidden = false;
document.title = (name ? name + ' · ' : '') + 'parfüm kartviziti';
const mc = document.createElement('meta'); mc.name = 'theme-color'; mc.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); document.head.appendChild(mc);
})();
</script>
</body>
</html>
