<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parfüm Çarkı</title>
<meta name="theme-color" content="#17110d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,50;1,9..144,400..600,50&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell; espresso ground, one orange→caramel gradient carries every accent (hero glow, primary buttons, wheel, active tab). */
:root{
  --bg:#17110d;
  --panel:#211812;
  --panel-2:#2b2019;
  --line:#3d2d22;
  --fg:#f8ede3;
  --muted:#b49d8b;
  --orange:#f26d21;
  --caramel:#c98a4b;
  --amber:#f0a25a;
  --ink:#2a1407;
  --danger:#ef7d6b;
  --grad:linear-gradient(115deg,var(--orange) 0%,#e5813a 45%,var(--caramel) 100%);
  --f-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:var(--amber)}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px calc(100px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-family:var(--f-display);font-weight:600;font-size:27px;letter-spacing:-.01em;margin:0;line-height:1}
.brand em{font-style:italic;font-weight:500;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:2px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:700}
h2{font-family:var(--f-display);font-weight:600;font-size:23px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0}
.section{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:10px 17px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--caramel)}
.btn.primary{background:var(--grad);color:var(--ink);border-color:transparent;box-shadow:0 8px 24px -10px rgb(242 109 33 / .7)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;flex:none;padding:0}
.icon-btn svg{width:18px;height:18px}
.icon-btn.added{background:var(--grad);color:var(--ink);border-color:transparent}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none}
.chip.on{background:color-mix(in srgb,var(--orange) 18%,transparent);border-color:var(--orange);color:var(--fg)}
.pill{font-size:11px;letter-spacing:.03em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.boyner{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:#f8ede3;color:#17110d;white-space:nowrap}

/* art */
.art{position:relative;overflow:hidden;background:var(--panel-2);display:block}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.ph{position:absolute;inset:0;display:grid;place-items:center;background:
  radial-gradient(120% 80% at 30% 15%,hsl(var(--h) 75% 55% / .85),transparent 60%),
  linear-gradient(160deg,hsl(var(--h) 45% 26%),hsl(calc(var(--h) - 12) 40% 12%))}
.ph span{font-family:var(--f-display);font-style:italic;font-size:2.4em;color:hsl(var(--h) 80% 88%)}

/* families */
.fam{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;background:hsl(var(--fh) 55% 50% / .15);border:1px solid hsl(var(--fh) 55% 60% / .4);color:hsl(var(--fh) 75% 82%);white-space:nowrap}
.fam::before{content:"";width:7px;height:7px;border-radius:50%;background:hsl(var(--fh) 75% 62%)}
.fam-line{display:flex;flex-wrap:wrap;gap:6px}

/* today hero */
.hero{display:grid;grid-template-columns:122px 1fr;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -30% auto auto;width:70%;aspect-ratio:1;background:radial-gradient(circle,rgb(242 109 33 / .28),transparent 65%);pointer-events:none}
.hero .art{border-radius:14px;aspect-ratio:4/5;font-size:22px}
.hero-body{display:flex;flex-direction:column;gap:6px;min-width:0;padding-block:2px;position:relative}
.hero-name{font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1.1;margin:0;overflow-wrap:anywhere;text-wrap:balance;letter-spacing:-.01em}
.hero-brand{color:var(--amber);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.hero-actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.notes-mini{font-size:13px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* week */
.week{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.day{display:grid;grid-template-columns:44px 44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.today{background:linear-gradient(90deg,rgb(242 109 33 / .14),transparent 70%)}
.dname{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.dname b{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.dname span{font-family:var(--f-display);font-size:21px;font-variant-numeric:tabular-nums}
.day.today .dname b{color:var(--orange)}
.day .art{width:44px;height:54px;border-radius:9px;font-size:9px}
.dinfo{min-width:0;display:flex;flex-direction:column;gap:2px}
.dinfo .pn{font-family:var(--f-display);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dinfo .none{font-size:13px;color:var(--muted)}
.sel{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:0 14px 0 0;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 6px) 55%,calc(100% - 2px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.sel option{background:var(--panel);color:var(--fg);text-transform:none}

/* wheel */
.wheel-wrap{position:relative;width:min(100%,380px);margin:6px auto 0;aspect-ratio:1}
.wheel-wrap canvas{width:100%;height:100%;display:block;cursor:pointer;border-radius:50%;box-shadow:0 24px 60px -18px rgb(242 109 33 / .45)}
.pointer{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:28px solid var(--fg);filter:drop-shadow(0 3px 5px rgb(0 0 0 / .5));z-index:2}
.result{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;align-items:center;background:var(--panel);border:1px solid var(--orange);border-radius:var(--r);padding:12px;animation:pop .45s ease-out}
.result .art{border-radius:12px;aspect-ratio:4/5;font-size:14px}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}

/* lists & cards */
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:12px 18px;font-size:15px}
.search:focus{border-color:var(--orange);outline:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;color:var(--fg)}
.card .art{aspect-ratio:4/5;font-size:20px}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card-name{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.card-brand{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700}
.sample-tag{position:absolute;top:8px;left:8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:rgb(0 0 0 / .6);padding:3px 7px;border-radius:6px;color:#fff;z-index:1}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.note{background:color-mix(in srgb,var(--caramel) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--caramel) 40%,var(--line));border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;color:var(--fg)}
.item:first-child{border-top:0}
.item .art{width:52px;height:64px;border-radius:10px;font-size:11px}
.item-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.item-name{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.item-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.shelf{display:flex;gap:12px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf .card{flex:none;width:148px;scroll-snap-align:start}
.price{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}

/* detail */
.detail-head{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:end}
.detail-head .art{border-radius:16px;aspect-ratio:4/5;font-size:26px}
.pyramid{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tier{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.tier:first-child{border-top:0;background:linear-gradient(90deg,rgb(242 109 33 / .12),transparent)}
.tier:nth-child(2){background:linear-gradient(90deg,rgb(229 129 58 / .08),transparent)}
.tier:nth-child(3){background:linear-gradient(90deg,rgb(201 138 75 / .06),transparent)}
.tier-name{display:flex;flex-direction:column;gap:2px}
.tier-name b{font-family:var(--f-display);font-weight:600;font-size:17px}
.tier-name span{font-size:11px;color:var(--muted)}
.tier .chips{gap:6px}
.note-chip{font-size:13px;padding:4px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.dots{display:flex;gap:5px}
.dots i{flex:1;max-width:26px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--grad)}
.rate{display:flex;gap:6px}
.rate button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.rate button.on{background:var(--grad);border-color:transparent;color:var(--ink)}
.tap{cursor:pointer}

/* settings */
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;position:relative}
.field>label,.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.input,textarea.input,select.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.input:focus{border-color:var(--orange);outline:none}
textarea.input{resize:vertical;min-height:70px}
.chip .x{margin-left:6px;opacity:.7}
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.menu button{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:var(--fg)}
.menu button:first-child{border-top:0}
.menu .mi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2)}
.menu .mi svg{width:19px;height:19px;color:var(--amber)}
.menu b{font-weight:600;display:block}
.menu small{color:var(--muted);font-size:13px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:600;padding:0;margin-bottom:6px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch input:checked+span{background:var(--grad)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--amber);outline-offset:2px}
.rem{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.rem.off{opacity:.7}
.time{font-family:var(--f-display);font-size:30px;font-weight:600;background:transparent;border:0;padding:0;font-variant-numeric:tabular-nums;width:auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--orange)}
.status{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);font-size:14px}
.status i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.status.ok i{background:#7ccf8a}
.status.warn i{background:var(--amber)}
.suggest{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.suggest button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--fg)}
.suggest button:first-child{border-top:0}
.suggest small{color:var(--muted);font-size:12px}
.update{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--grad);color:var(--ink);font-weight:600;margin-bottom:18px}
.update .btn{background:var(--ink);color:var(--fg);border-color:transparent}

/* sheet */
.overlay{position:fixed;inset:0;background:rgb(10 6 3 / .72);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.photo-pick{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center}
.photo-pick .art{border-radius:12px;aspect-ratio:4/5;font-size:16px}
.file-label{position:relative;overflow:hidden}
.file-label input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--orange)}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;animation:fade .2s;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1 class="brand">Parfüm <em>Çarkı</em></h1>
    <span class="eyebrow" id="today-label"></span>
  </header>
  <div id="update-slot"></div>
  <main id="view"><p class="muted">Yükleniyor…</p></main>
</div>

<nav class="tabs" aria-label="Bölümler">
  <div class="tabs-in">
    <button class="tab" data-tab="hafta" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Hafta</button>
    <button class="tab" data-tab="cark" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6 6 18"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>Çark</button>
    <button class="tab" data-tab="kesfet" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>Keşfet</button>
    <button class="tab" data-tab="koleksiyon" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9.5 3h5v3h-5zM10.5 6v2M13.5 6v2"/><rect x="6" y="8" width="12" height="13" rx="3"/><path d="M9 14h6"/></svg>Koleksiyon</button>
    <button class="tab" data-tab="ayarlar" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ayarlar</button>
  </div>
</nav>

<script>
(() => {
'use strict';

/* ---------- native bridge (Android app) ---------- */
const NATIVE = (() => { try { return window.ParfumApp && typeof window.ParfumApp.isApp === 'function' && window.ParfumApp.isApp() ? window.ParfumApp : null; } catch (e) { return null; } })();
const nativeCall = (fn, ...a) => { try { return NATIVE && NATIVE[fn] ? NATIVE[fn](...a) : undefined; } catch (e) { return undefined; } };

/* ---------- constants ---------- */
const DEFAULT_CATS = ['Günlük','Date','Akşam','Sexy','Ofis','Spor','Yaz','Kış','Özel Gün'];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fimg = id => `https://fimgs.net/mdimg/perfume/375x500.${id}.jpg`;
const fold = s => String(s || '').replace(/ı/g,'i').replace(/İ/g,'i').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const normBrand = s => String(s || '').toLowerCase().replace(/&/g,'and').replace(/\bparfums?\b|\bperfumes?\b|\bfragrances?\b|\bparis\b/g,'').replace(/[^a-z0-9]/g,'');

function toPerfume(r, extra){
  return norm({id: uid(), cid: r[0], name: r[1], brand: r[2], g: r[4], lon: r[6], sil: r[7], fam: r[8].slice(),
    top: r[9].slice(), heart: r[10].slice(), base: r[11].slice(), cats: r[12].slice(), img: fimg(r[0]), conc: '', note: '', ...extra});
}
function norm(p){
  for (const k of ['cats','fam','top','heart','base']) if (!Array.isArray(p[k])) p[k] = [];
  if (typeof p.conc !== 'string') p.conc = '';
  if (typeof p.img !== 'string') p.img = '';
  p.lon = +p.lon || 0; p.sil = +p.sil || 0;
  return p;
}

/* ---------- storage ---------- */
const KEY = 'parfum-carki-v1';
let dbp = null;
function db(){
  if (!dbp) dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('parfum-carki', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbp;
}
async function idbGet(k){
  const d = await db();
  return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbSet(k, v){
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction('kv','readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function load(){
  try { const v = await idbGet(KEY); if (v) return v; } catch (e) {}
  try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {}
  return null;
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await idbSet(KEY, S); }
    catch (e) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e2) { toast('Kaydedilemedi: depolama dolu olabilir'); } }
    syncNative();
  }, 150);
}

/* ---------- catalog ---------- */
let CAT = null, CAT_LOADING = null, BOY = null, BOY_KEYS = new Map();
async function loadBoyner(){
  if (BOY) return BOY;
  try {
    const r = await fetch('data/boyner.json');
    if (!r.ok) throw new Error(r.status);
    BOY = await r.json(); idbSet('boyner', BOY).catch(() => {});
  } catch (e) { try { BOY = await idbGet('boyner'); } catch (e2) {} }
  BOY = BOY || {brands: [], top: []};
  BOY_KEYS = new Map(BOY.brands.map(b => [b.k, b]));
  return BOY;
}
const boynerBrand = brand => BOY_KEYS.get(normBrand(brand));
function loadCatalog(){
  if (CAT) return Promise.resolve(CAT);
  if (CAT_LOADING) return CAT_LOADING;
  CAT_LOADING = (async () => {
    await loadBoyner();
    let data = null;
    try {
      const r = await fetch('data/catalog.json');
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
      idbGet('catalog-v').then(v => { if (v !== data.v) { idbSet('catalog', data).catch(() => {}); idbSet('catalog-v', data.v).catch(() => {}); } }).catch(() => {});
    } catch (e) { try { data = await idbGet('catalog'); } catch (e2) {} }
    if (!data) { CAT_LOADING = null; throw new Error('Katalog yüklenemedi'); }
    CAT = data.items.map(r => ({r, key: fold(r[1] + ' ' + r[2]), nkey: fold([...r[8], ...r[9], ...r[10], ...r[11]].join(' ')), boy: BOY_KEYS.has(normBrand(r[2]))}));
    CAT.byId = new Map(CAT.map(c => [c.r[0], c]));
    return CAT;
  })();
  return CAT_LOADING;
}
function matchBoynerProduct(p){
  if (!CAT || !p) return null;
  const k = normBrand(p.b), t = fold(p.t);
  let best = null;
  for (const c of CAT) {
    if (normBrand(c.r[2]) !== k) continue;
    const n = fold(c.r[1]);
    if (n.length > 2 && t.includes(n) && (!best || n.length > fold(best.r[1]).length || (n.length === fold(best.r[1]).length && c.r[5] > best.r[5]))) best = c;
  }
  return best;
}

function weekKey(){
  const t = new Date(); t.setHours(0,0,0,0);
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return t.getFullYear() + '-' + (t.getMonth()+1) + '-' + t.getDate();
}
function dateOf(d){
  const t = new Date(); t.setHours(0,0,0,0);
  const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  const r = new Date(mon); r.setDate(mon.getDate() + (d + 6) % 7);
  return r.getDate();
}
function hue(str){ let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return 8 + (h % 40); }
function art(p){
  const name = p && p.name || '?';
  const ph = `<div class="ph" style="--h:${hue(name)}"><span>${esc(name.trim().charAt(0).toUpperCase())}</span></div>`;
  return p && p.img ? ph + `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : ph;
}
const famHue = f => FAM_HUE[f] ?? hue(f) * 7 % 360;
const famTag = f => `<span class="fam" style="--fh:${famHue(f)}">${esc(f)}</span>`;
const dots = (n, label) => `<div class="meter"><span class="eyebrow">${label}</span><div class="dots" aria-label="${label} ${n}/5">${[1,2,3,4,5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div></div>`;
const notesLine = p => [...p.top, ...p.heart, ...p.base].slice(0, 6).join(' · ');
const pick = a => a[Math.floor(Math.random() * a.length)];
const poolFor = cat => S.perfumes.filter(p => cat === ANY || p.cats.includes(cat));
function autoCats(fam){
  const sc = {};
  fam.slice(0, 5).forEach((f, i) => (FAM_CATS[f] || []).forEach((c, j) => { sc[c] = (sc[c] || 0) + (1 - i * .15) * (1 - j * .2); }));
  const ranked = Object.entries(sc).filter(([c]) => S.cats.includes(c)).sort((a, b) => b[1] - a[1]);
  if (!ranked.length) return [];
  return ranked.filter(([, s]) => s >= Math.max(.6, ranked[0][1] * .5)).slice(0, 4).map(([c]) => c);
}

function rollDay(d, used){
  const pool = poolFor(S.week[d].cat);
  if (!pool.length) return null;
  const fresh = pool.filter(p => !used.has(p.id) && p.id !== S.week[d].pid);
  const fresh2 = pool.filter(p => !used.has(p.id));
  return pick(fresh.length ? fresh : fresh2.length ? fresh2 : pool).id;
}
function shuffleWeek(){
  const used = new Set();
  for (const {d} of DAYS) { const id = rollDay(d, used); S.week[d].pid = id; if (id) used.add(id); }
}
function repairWeek(){
  for (const {d} of DAYS) {
    if (!S.week[d]) S.week[d] = {cat: DEFAULT_WEEK[d], pid: null};
    const w = S.week[d];
    if (w.cat !== ANY && !S.cats.includes(w.cat)) w.cat = ANY;
    const p = w.pid && byId(w.pid);
    if (!p || (w.cat !== ANY && !p.cats.includes(w.cat))) {
      const used = new Set(DAYS.map(x => S.week[x.d] && S.week[x.d].pid).filter(Boolean));
      w.pid = rollDay(d, used);
    }
  }
}

/* ---------- notifications plan ---------- */
function msgFor(p, title, cat){
  const bits = [p.brand, cat ? cat + ' günü' : '', p.top.slice(0, 3).join(', ')].filter(Boolean);
  return {t: title + p.name, b: bits.join(' · ')};
}
function buildPlan(){
  const reminders = S.notif.reminders.filter(r => r.on && r.days.length).map(r => {
    const [h, m] = r.time.split(':').map(Number);
    const msgs = {};
    for (let d = 0; d < 7; d++) {
      let list = [];
      if (r.kind === 'today') {
        const p = S.week[d] && S.week[d].pid && byId(S.week[d].pid);
        if (p) list = [msgFor(p, 'Bugün: ', S.week[d].cat)];
      } else {
        const pool = r.kind === 'cat' ? poolFor(r.cat) : S.perfumes.slice();
        list = pool.slice(0, 40).map(p => msgFor(p, r.kind === 'cat' ? r.cat + ' için: ' : 'Öneri: ', ''));
      }
      if (!list.length) list = [{t: 'Bugün ne sıksan?', b: 'Parfüm Çarkı\'nı aç, çarkı çevir.'}];
      msgs[d] = list;
    }
    return {id: r.id, h, m, days: r.days, msgs};
  });
  return {reminders};
}
let lastPlan = '';
function syncNative(){
  if (!NATIVE || !S) return;
  const plan = JSON.stringify(buildPlan());
  if (plan === lastPlan) return;
  lastPlan = plan; nativeCall('schedule', plan);
}
window.onNativePermission = () => { if (S && S.tab === 'ayarlar') render(); };

/* ---------- updates (APK) ---------- */
function repoInfo(){
  const h = location.hostname;
  if (!h.endsWith('.github.io')) return null;
  const owner = h.split('.')[0];
  const repo = location.pathname.split('/').filter(Boolean)[0] || h;
  return {owner, repo};
}
let LATEST = null;
async function checkUpdate(){
  const ri = repoInfo(); if (!ri) return;
  try {
    const r = await fetch(`https://api.github.com/repos/${ri.owner}/${ri.repo}/releases/latest`, {headers: {Accept: 'application/vnd.github+json'}});
    if (!r.ok) return;
    const j = await r.json();
    const asset = (j.assets || []).find(a => a.name.endsWith('.apk'));
    LATEST = {v: parseInt(String(j.tag_name).replace(/\D/g, ''), 10) || 0, url: asset ? asset.browser_download_url : j.html_url, page: j.html_url};
    renderUpdate();
  } catch (e) {}
}
const appVersion = () => parseInt(nativeCall('versionCode') || '0', 10) || 0;
function renderUpdate(){
  const slot = document.getElementById('update-slot');
  if (NATIVE && LATEST && LATEST.v > appVersion()) {
    slot.innerHTML = `<div class="update"><span>Uygulamanın yeni sürümü hazır</span><a class="btn sm" href="${esc(LATEST.url)}" data-act="extlink">İndir ve kur</a></div>`;
  } else slot.innerHTML = '';
}

let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());

  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400);
}

const SEG_TEXT = ['#2a1407','#f8ede3','#2a1407','#f8ede3','#2a1407','#f8ede3','#2a1407','#f8ede3'];
function filteredWheel(){
  const c = S.wheelCats;
  return c.length ? S.perfumes.filter(p => p.cats.some(x => c.includes(x))) : S.perfumes.slice();
}
function renderWheel(){
  wheelList = filteredWheel();
  const last = S.lastSpin && byId(S.lastSpin);
  view.innerHTML = `
  <section class="section">
    <div class="row spread"><h2>Ne sıksam?</h2><span class="muted small">${wheelList.length} parfüm</span></div>
    <div class="chips scroll" role="group" aria-label="Kategori filtresi">
      <button class="chip${S.wheelCats.length ? '' : ' on'}" data-act="wcat" data-cat="" type="button">${ANY}</button>
      ${S.cats.map(c => `<button class="chip${S.wheelCats.includes(c) ? ' on' : ''}" data-act="wcat" data-cat="${esc(c)}" type="button">${esc(c)}</button>`).join('')}
    </div>
  </section>
  <section class="section">
    ${wheelList.length ? `
    <div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" aria-label="Parfüm çarkı, çevirmek için dokun" role="button" tabindex="0"></canvas></div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="spin-btn" data-act="spin" type="button">Çarkı çevir</button></div>`
    : `<div class="empty">Seçili kategorilerde parfüm yok. Başka bir kategori seç ya da Keşfet'ten parfüm ekle.</div>`}
    <div id="result">${last ? resultCard(last) : ''}</div>
  </section>`;
  if (wheelList.length) {
    const cv = document.getElementById('wheel');
    drawWheel(cv);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawWheel(cv));
  }
}
function resultCard(p){
  const isToday = S.week[today()].pid === p.id;
  return `<div class="result">
    <div class="art tap" data-act="view" data-id="${p.id}">${art(p)}</div>

        <button class="btn sm ghost" data-act="view" data-id="${p.id}" type="button">Koku profili</button></div>
    </div></div>`;

function drawWheel(cv){
  if (!cv || !cv.isConnected) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const size = cv.clientWidth || 320;
  if (cv.width !== Math.round(size * dpr)) { cv.width = cv.height = Math.round(size * dpr); }
  const ctx = cv.getContext('2d'); const W = cv.width, c = W / 2, r = c - 4 * dpr;
  const n = wheelList.length, a = Math.PI * 2 / n;
  ctx.clearRect(0, 0, W, W);
  for (let i = 0; i < n; i++) {
    const st = rot + i * a - Math.PI / 2;
    let ci = i % SEG.length;
    if (n > 1 && i === n - 1 && ci === 0) ci = 3;
    ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, st, st + a); ctx.closePath();
    ctx.fillStyle = SEG[ci]; ctx.fill();
    if (n > 1) { ctx.strokeStyle = 'rgba(23,17,13,.55)'; ctx.lineWidth = 1.5 * dpr; ctx.stroke(); }
    ctx.save(); ctx.translate(c, c); ctx.rotate(st + a / 2);
    const fs = Math.max(11, Math.min(17, 300 / Math.max(n, 1) + 8)) * dpr;
    ctx.font = `600 ${fs}px Fraunces, Georgia, serif`;
    ctx.fillStyle = SEG_TEXT[ci]; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    let label = wheelList[i].name; const maxW = r * 0.66;
    if (ctx.measureText(label).width > maxW) { while (label.length > 2 && ctx.measureText(label + '…').width > maxW) label = label.slice(0, -1); label += '…'; }
    ctx.fillText(label, r - 14 * dpr, 0);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.strokeStyle = '#f8ede3'; ctx.lineWidth = 3 * dpr; ctx.stroke();
  const hr = r * 0.17;
  const g = ctx.createLinearGradient(c - hr, c - hr, c + hr, c + hr); g.addColorStop(0, '#f26d21'); g.addColorStop(1, '#c98a4b');
  ctx.beginPath(); ctx.arc(c, c, hr, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3 * dpr; ctx.strokeStyle = '#17110d'; ctx.stroke();
  ctx.fillStyle = '#2a1407'; ctx.font = `800 ${11 * dpr}px "Plus Jakarta Sans", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('ÇEVİR', c, c + 0.5 * dpr);
}
function spin(){
  if (spinning || !wheelList.length) return;
  const cv = document.getElementById('wheel'); if (!cv) return;
  spinning = true;
  const btn = document.getElementById('spin-btn'); if (btn) btn.disabled = true;
  const n = wheelList.length, a = Math.PI * 2 / n, TAU = Math.PI * 2;
  const i = Math.floor(Math.random() * n);
  const jitter = (Math.random() - 0.5) * a * 0.7;
  const delta = ((-(i + 0.5) * a + jitter - rot) % TAU + TAU) % TAU;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const from = rot, to = rot + (reduce ? 1 : 6 + Math.floor(Math.random() * 3)) * TAU + delta;
  const dur = reduce ? 700 : 4800 + Math.random() * 800;
  const t0 = performance.now(); let lastSeg = -1;
  const ease = x => 1 - Math.pow(1 - x, 4);
  (function frame(now){
    const k = Math.min(1, (now - t0) / dur);
    rot = from + (to - from) * ease(k);
    drawWheel(cv);
    const seg = Math.floor((((-rot) % TAU + TAU) % TAU) / a);
    if (seg !== lastSeg) { lastSeg = seg; try { navigator.vibrate && navigator.vibrate(3); } catch (e) {} }
    if (k < 1) return requestAnimationFrame(frame);
    rot = ((rot % TAU) + TAU) % TAU;
    spinning = false; if (btn) btn.disabled = false;
    const p = wheelList[Math.floor((((-rot) % TAU + TAU) % TAU) / a) % n];
    S.lastSpin = p.id; save();
    const res = document.getElementById('result'); if (res) res.innerHTML = resultCard(p);
    try { navigator.vibrate && navigator.vibrate([20, 40, 30]); } catch (e) {}
  })(t0);
}

    </button>

function searchCatalog(){
  const toks = fold(ex.q).split(/\s+/).filter(Boolean);
  const out = [];
  for (const c of CAT) {
    if (ex.boy && !c.boy) continue;
    if (ex.g && c.r[4] !== ex.g) continue;
    if (ex.cat && !c.r[12].includes(ex.cat)) continue;
    let rank = 0;
    if (toks.length) {
      if (toks.every(t => c.key.includes(t))) rank = 0;
      else if (toks.every(t => c.key.includes(t) || c.nkey.includes(t))) rank = 1;
      else continue;
    }
    out.push([c, rank]);
  }
  out.sort((a, b) => (a[1] - b[1]) || ((b[0].boy ? 1 : 0) - (a[0].boy ? 1 : 0)) || (b[0].r[5] - a[0].r[5]));
  return out.map(x => x[0]);
}

function suggestFor(q){
  const box = document.getElementById('f-suggest'); if (!box) return;
  const t = fold(q).trim();
  if (!CAT || t.length < 2 || (draft && draft.cid)) { box.innerHTML = ''; return; }
  const toks = t.split(/\s+/);
  const res = [];
  for (const c of CAT) { if (toks.every(x => c.key.includes(x))) { res.push(c); if (res.length > 200) break; } }
  res.sort((a, b) => ((b.boy ? 1 : 0) - (a.boy ? 1 : 0)) || (b.r[5] - a.r[5]));
  box.innerHTML = res.length ? `<div class="suggest">${res.slice(0, 5).map(c => `<button data-act="fpick" data-cid="${c.r[0]}" type="button"><span>${esc(c.r[1])}</span><small>${esc(c.r[2])}${c.boy ? ' · Boyner' : ''} · katalogdan doldur</small></button>`).join('')}</div>` : '';
}
function resizeImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('img'));
      im.onload = () => {
        const max = 520, s = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      break;
    }
    case 'sharebk': toast(nativeCall('saveBackup', JSON.stringify(S)) || 'Kaydedilemedi'); break;
    case 'import': applyImport(document.getElementById('imp-text').value.trim()); break;
    case 'reset':
      if (armed !== 'reset') { armed = 'reset'; renderBackup(); break; }
      S = freshState(); S.tab = 'ayarlar'; S.weekKey = weekKey(); shuffleWeek(); armed = ''; save(); render(); toast('Sıfırlandı'); break;
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === 'daycat') {
    const d = +t.dataset.day; S.week[d].cat = t.value;
    const used = new Set(DAYS.filter(x => x.d !== d).map(x => S.week[x.d].pid).filter(Boolean));
    S.week[d].pid = rollDay(d, used); save(); render();
  }
  if (t.dataset && t.dataset.rem && t.dataset.k) {
    const r = remById(t.dataset.rem); if (!r) return;
    const k = t.dataset.k;
    r[k] = k === 'on' ? t.checked : t.value;
    if (k === 'on' && t.checked && NATIVE && !nativeCall('hasNotifPermission')) nativeCall('requestNotifPermission');
    save(); if (k !== 'label') renderNotif();
  }
  if (t.id === 'f-photo' && t.files && t.files[0]) {
    syncDraft();
    try { draft.img = await resizeImage(t.files[0]); drawSheet(); }
    catch (err) { toast('Bu fotoğraf açılamadı, başka bir tane dene'); }
  }
  if (t.id === 'imp-file' && t.files && t.files[0]) {
    const fr = new FileReader(); fr.onload = () => applyImport(String(fr.result)); fr.readAsText(t.files[0]);
  }
});
let exT;
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'col-search') { colQuery = e.target.value; renderGrid(); }
  if (id === 'ex-q') { ex.q = e.target.value; ex.limit = 40; clearTimeout(exT); exT = setTimeout(renderExploreBody, 160); }
  if (id === 'f-name' && draft) {
    draft.name = e.target.value; if (draft.cid) delete draft.cid;
    if (!draft.img) { const pv = document.getElementById('f-preview'); if (pv) pv.innerHTML = art(draft.name ? draft : {name: '+'}); }
    clearTimeout(exT); exT = setTimeout(() => suggestFor(e.target.value), 160);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'sheet' && sheetMode === 'edit') saveDraft();
  if (e.target.id === 'cat-form') {
    const v = document.getElementById('cat-new').value.trim();
    if (!v) return;
    if (S.cats.some(c => fold(c) === fold(v))) { toast('Bu kategori zaten var'); return; }
    S.cats.push(v); save(); renderCats(); toast('“' + v + '” eklendi');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('overlay')) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'wheel') { e.preventDefault(); spin(); }
});
document.addEventListener('pointerup', e => { if (e.target.id === 'wheel') spin(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => drawWheel(document.getElementById('wheel')), 120); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S) return;
  if (S.weekKey !== weekKey()) { S.weekKey = weekKey(); shuffleWeek(); save(); render(); }
  if (S.tab === 'ayarlar' && S.sub === 'bildirim') renderNotif();
});
// Android back button: native asks the page first
window.onNativeBack = () => {
  if (document.getElementById('overlay')) { closeSheet(); return true; }
  if (S.tab === 'ayarlar' && S.sub) { S.sub = null; render(); return true; }
  if (S.tab !== 'hafta') { go('hafta'); return true; }
  return false;
};

/* ---------- boot ---------- */
(async () => {
  const saved = await load();
  S = saved && Array.isArray(saved.perfumes) ? {...freshState(), ...saved} : freshState();
  S.perfumes.forEach(norm);
  if (!S.notif || !Array.isArray(S.notif.reminders)) S.notif = {reminders: defaultReminders()};
  if (S.weekKey !== weekKey()) { S.weekKey = weekKey(); shuffleWeek(); }
  repairWeek(); save(); render();
  loadBoyner();
  checkUpdate();
})();
})();
</script>
</body>
</html>
