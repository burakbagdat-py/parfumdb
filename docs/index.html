/* ---------- similar perfumes and cheaper alternatives ---------- */
const FAM_W = [1, .8, .6, .45, .35];
// widely known clones (catalog ids): original → its dupes. Shown first and marked, so the best-known answers never move.
const KNOWN_DUPES = {
  9828: [34696, 40405, 27352],          // Creed Aventus → Club de Nuit Intense Man, L'Aventure, Supremacy Silver
  33519: [63062, 78476, 89849],         // Baccarat Rouge 540 → Ana Abiyedh Rouge, Club de Nuit Untold, Baroque Rouge 540
  62615: [75805],                       // Angels' Share → Khamrah
  53641: [64948],                       // Oud for Greatness → Bade'e Al Oud Oud for Glory
  43871: [90273],                       // Delina → Delilah
  68415: [72821],                       // Sauvage Elixir → Asad
  31861: [93538],                       // Sauvage → Salvo
  50757: [70465],                       // Y Eau de Parfum → Fakhar Black
  30947: [65414],                       // Ultra Male → 9pm
  84109: [94713],                       // Althaïr → Liquid Brun
  25967: [78475], 9099: [78475],        // Bleu de Chanel → Club de Nuit Blue Iconic
  81642: [102026]                       // Le Male Elixir → Club de Nuit Lionheart Man
};
const DUPE_OF = {};
for (const [o, ds] of Object.entries(KNOWN_DUPES)) for (const d of ds) (DUPE_OF[d] = DUPE_OF[d] || []).push(+o);
// rare notes say more than common ones (oud vs bergamot), and heart/base notes shape a scent more than the opening
const TIER_W = [.7, 1, 1.15];
let NOTE_DF = null;
function noteDf(){
  if (NOTE_DF) return NOTE_DF;
  NOTE_DF = new Map();
  for (const c of CAT) for (const n of new Set([...c.r[9], ...c.r[10], ...c.r[11]].map(fold))) NOTE_DF.set(n, (NOTE_DF.get(n) || 0) + 1);
  return NOTE_DF;
}
function noteVec(top, heart, base){
  const df = noteDf(), N = CAT.length, v = new Map();
  [top, heart, base].forEach((l, t) => l.forEach(n => {
    const k = fold(n); if (!k) return;
    const w = Math.log(N / ((df.get(k) || 0) + 1)) * TIER_W[t];
    if (w > (v.get(k) || 0)) v.set(k, w);
  }));
  let nn = 0; for (const w of v.values()) nn += w * w;
  v.norm = Math.sqrt(nn);
  return v;
}
function famVec(fam){
  const v = new Map(); fam.slice(0, 6).forEach((f, i) => v.set(f, FAM_W[i] || .25));
  let nn = 0; for (const w of v.values()) nn += w * w; v.norm = Math.sqrt(nn);
  return v;
}
function cosine(a, b){
  if (!a.norm || !b.norm) return 0;
  let d = 0; for (const [k, w] of a) { const x = b.get(k); if (x) d += w * x; }
  return d / (a.norm * b.norm);
}
const catVecs = c => c.nv || (c.nv = noteVec(c.r[9], c.r[10], c.r[11]), c.fv = famVec(c.r[8]), c.nv);
function similarTo(p, cheapOnly){
  if (!CAT) return [];
  const pn = noteVec(p.top, p.heart, p.base), pf = famVec(p.fam);
  if (!pn.norm && !pf.norm) return [];
  const brandK = normBrand(p.brand), line = p.brand ? lineKey(p.brand, p.name) : '';
  const out = [];
  for (const c of CAT) {
    const r = c.r;
    if (r[0] === p.cid || r[5] < 150) continue;
    if (cheapOnly && !(r[15] === 'O' || r[15] === 'M')) continue;
    const sameBrand = normBrand(r[2]) === brandK;
    if (cheapOnly && sameBrand) continue;
    // its own flankers are listed under "Aynı seriden"
    if (sameBrand && line && lineKey(r[2], r[1]) === line) continue;
    catVecs(c);
    const ns = cosine(pn, c.nv), fs = cosine(pf, c.fv);
    let score = pn.norm && c.nv.norm ? ns * .6 + fs * .4 : fs * .75;
    // a men's scent is a weaker match for a women's one and vice versa
    if (p.g && r[4] && p.g !== 'U' && r[4] !== 'U' && p.g !== r[4]) score *= .8;
    // well-known perfumes win close calls, and current releases are preferred over old, hard-to-find ones
    score *= 1 + Math.min(.08, Math.log10(r[5]) * .02);
    const y = r[3] || 0;
    score *= y >= 2020 ? (cheapOnly ? 1.12 : 1.06) : y >= 2015 ? (cheapOnly ? 1.06 : 1.03) : y && y < 2005 ? .93 : 1;
    if (cheapOnly && y && y < 2010 && r[5] < 2000) continue;
    if (KNOWN_DUPES[p.cid] && KNOWN_DUPES[p.cid].includes(r[0])) continue;
    if (score > .34) out.push([c, score]);
  }
  out.sort((a, b) => b[1] - a[1] || b[0].r[5] - a[0].r[5]);
  return out.slice(0, 12);
}
// the notes a match shares with this perfume, rarest first: "why is it similar?"
function sharedNotes(p, c){
  const pn = noteVec(p.top, p.heart, p.base), names = new Map([...c.r[9], ...c.r[10], ...c.r[11]].map(n => [fold(n), n]));
  return [...pn.entries()].filter(([k]) => names.has(k)).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k]) => names.get(k));
}
function simPane(p){
  if (!CAT) { loadCatalog().then(() => { const el = document.querySelector('.dpane[data-pane="sim"]'); if (el) el.innerHTML = simPane(p); }); return '<span class="muted small">Katalog yükleniyor…</span>'; }
  const list = similarTo(p, S.sim.cheap);
  const known = (KNOWN_DUPES[p.cid] || []).map(id => CAT.byId.get(id)).filter(Boolean);
  const origin = (DUPE_OF[p.cid] || []).map(id => CAT.byId.get(id)).filter(Boolean);
  const kRow = (c, tag) => `<div class="item">
      <div class="art tap" data-act="cview" data-cid="${c.r[0]}">${art({name: c.r[1], img: fimg(c.r[0])})}</div>
      <div class="item-body tap" data-act="cview" data-cid="${c.r[0]}"><span class="item-name">${esc(c.r[1])} ${catConc(c.r)}</span>
        <span class="item-meta"><span lang="en">${esc(c.r[2])}</span> ${segTag(c.r[15])}${c.r[3] ? ' · ' + c.r[3] : ''}${c.r[13] ? ' · ★ ' + c.r[13].toFixed(1) : ''}</span></div>
      <span class="dupe-tag">${tag}</span></div>`;
  const knownHtml = (origin.length ? `<span class="label">Bunun ilham aldığı parfüm</span><div class="list">${origin.map(c => kRow(c, 'Orijinal')).join('')}</div>` : '')
    + (known.length ? `<span class="label">Bilinen muadiller</span><div class="list">${known.map(c => kRow(c, 'Muadil')).join('')}</div>` : '');
  return `${knownHtml}<div class="chips"><button class="chip${S.sim.cheap ? '' : ' on'}" data-act="simcheap" data-v="0" type="button">Benzerler</button><button class="chip${S.sim.cheap ? ' on' : ''}" data-act="simcheap" data-v="1" type="button">Uygun muadiller</button></div>
    ${list.length ? `<div class="list">${list.map(([c, sc]) => `<div class="item">
      <div class="art tap" data-act="cview" data-cid="${c.r[0]}">${art({name: c.r[1], img: fimg(c.r[0])})}</div>
      <div class="item-body tap" data-act="cview" data-cid="${c.r[0]}"><span class="item-name">${esc(c.r[1])} ${catConc(c.r)}</span>
        <span class="item-meta"><span lang="en">${esc(c.r[2])}</span> ${segTag(c.r[15])}${c.r[3] ? ' · ' + c.r[3] : ''}${c.r[13] ? ' · ★ ' + c.r[13].toFixed(1) : ''}</span>
        ${(() => { const sh = sharedNotes(p, c); return sh.length ? `<span class="sim-why">Ortak: ${esc(sh.join(', '))}</span>` : `<div class="fam-line">${c.r[8].slice(0, 2).map(famTag).join('')}</div>`; })()}</div>
      <span class="sim-pct">%${Math.round(Math.min(.99, sc) * 100)}</span></div>`).join('')}</div>`
      : `<div class="empty">${S.sim.cheap ? 'Bu parfüme yakın uygun fiyatlı muadil bulunamadı.' : 'Yeterince benzer parfüm bulunamadı.'}</div>`}
    <span class="muted small">Benzerlik; notaların (nadir ve kalp/alt notalar daha ağır basar) ve ana akorların örtüşmesine göre hesaplanır. Aynı serinin versiyonları üstte “Aynı seriden” bölümünde.</span>`;
}

/* ---------- weather-based suggestion (Open-Meteo, no key, no location permission: the user picks a city) ---------- */
const CITIES = {'İstanbul': [41.01, 28.98], 'Ankara': [39.93, 32.86], 'İzmir': [38.42, 27.14], 'Bursa': [40.19, 29.06], 'Antalya': [36.89, 30.71],
  'Adana': [37.0, 35.32], 'Konya': [37.87, 32.48], 'Gaziantep': [37.07, 37.38], 'Kayseri': [38.72, 35.48], 'Mersin': [36.81, 34.64],
  'Eskişehir': [39.78, 30.52], 'Diyarbakır': [37.91, 40.24], 'Samsun': [41.29, 36.33], 'Trabzon': [41.0, 39.72], 'Erzurum': [39.9, 41.27],
  'Muğla': [37.21, 28.36], 'Bodrum': [37.03, 27.43], 'Kocaeli': [40.77, 29.94], 'Sakarya': [40.69, 30.43], 'Denizli': [37.78, 29.09],
  'Malatya': [38.35, 38.31], 'Van': [38.49, 43.38], 'Edirne': [41.68, 26.56], 'Çanakkale': [40.15, 26.41], 'Tekirdağ': [40.98, 27.51]};
let WX = null;
function wxDesc(code){
  if (code === 0) return ['açık', '☀'];
  if (code <= 3) return ['parçalı bulutlu', '⛅'];
  if (code === 45 || code === 48) return ['sisli', '🌫'];
  if (code >= 51 && code <= 67 || code >= 80 && code <= 82) return ['yağmurlu', '🌧'];
  if (code >= 71 && code <= 77 || code === 85 || code === 86) return ['karlı', '❄'];
  if (code >= 95) return ['fırtınalı', '⛈'];
  return ['bulutlu', '☁'];
}
async function fetchWeather(force){
  if (!S.weather || !S.weather.on) return null;
  if (!force && WX && Date.now() - WX.t < 45 * 60e3) return WX;
  const c = CITIES[S.weather.city] || CITIES['İstanbul'];
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c[0]}&longitude=${c[1]}&current=temperature_2m,weather_code&timezone=auto`);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    WX = {t: Date.now(), temp: Math.round(j.current.temperature_2m), code: j.current.weather_code, city: S.weather.city};
  } catch (e) { WX = null; }
  return WX;
}
function wxCats(w){
  const t = w.temp, wet = (w.code >= 51 && w.code <= 67) || (w.code >= 80 && w.code <= 82), snow = (w.code >= 71 && w.code <= 77);
  let cats = t >= 26 ? ['Yaz', 'Fresh', 'Aquatik', 'Narenciye', 'Tatil', 'Gündüz']
    : t >= 18 ? ['İlkbahar', 'Günlük', 'Yeşil', 'Çiçeksi', 'Dört Mevsim', 'Narenciye']
    : t >= 10 ? ['Sonbahar', 'Odunsu', 'Baharatlı', 'Dört Mevsim', 'Aromatik']
    : ['Kış', 'Gurme', 'Amber', 'Vanilyalı', 'Oryantal', 'Baharatlı'];
  if (wet) cats = [...cats, 'Odunsu', 'Misk', 'İsli'];
  if (snow) cats = [...cats, 'Kış', 'Gurme'];
  return cats;
}
function wxPick(w){
  const cats = wxCats(w);
  const scored = sourcePerfumes().map(p => [p, cats.reduce((n, c) => n + (inCat(p.cats, c) ? 1 : 0), 0)]).filter(x => x[1] > 0);
  if (!scored.length) return null;
  const best = Math.max(...scored.map(x => x[1]));
  return pick(scored.filter(x => x[1] >= best - 1).map(x => x[0]));
}
function wxLine(){
  if (!S.weather || !S.weather.on || !WX) return '';
  const [d, ic] = wxDesc(WX.code);
  return `<div class="wx">${ic} <span>${esc(WX.city)} <b>${WX.temp}°</b> · ${d}</span></div>`;
}
async function weatherBoot(){
  if (!S.weather || !S.weather.on) return;
  const w = await fetchWeather(); if (!w) return;
  const day = dayKey(Date.now());
  if (S.weather.auto && S.weather.day !== day) {
    const p = wxPick(w);
    if (p) { S.week[today()].pid = p.id; S.weather.day = day; save(); }
  }
  if (S.tab === 'hafta') render();
}

function suggestFor(q){
  const box = document.getElementById('f-suggest'); if (!box) return;
  const t = fold(q).trim();
  if (!CAT || t.length < 2 || (draft && draft.cid)) { box.innerHTML = ''; return; }
  const tk = t.split(/\s+/); const res = [];
  for (const c of CAT) { if (tk.every(x => c.key.includes(x))) { res.push(c); if (res.length > 200) break; } }
  res.sort((a, b) => ((b.boy ? 1 : 0) - (a.boy ? 1 : 0)) || (b.r[5] - a.r[5]));
  box.innerHTML = res.length ? `<div class="suggest">${res.slice(0, 5).map(c => `<button data-act="fpick" data-cid="${c.r[0]}" type="button"><span>${esc(c.r[1])}</span><small>${esc(c.r[2])}${c.boy ? ' · Boyner' : ''} · katalogdan doldur</small></button>`).join('')}</div>` : '';
}
function resizeImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('img'));
      im.onload = () => {
        const max = 520, s = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  toast(i >= 0 ? 'Güncellendi' : 'Koleksiyona eklendi');
}

function migrate(s){
  s.perfumes.forEach(norm);
  if (Array.isArray(s.cats)) {
    const extra = s.cats.map(c => OLD_CAT[c] || c).filter(c => !TAX_LABELS.includes(c));
    s.customCats = [...new Set([...(s.customCats || []), ...extra])];
    delete s.cats;
  }
  if (!Array.isArray(s.customCats)) s.customCats = [];
  if (!Array.isArray(s.inv)) s.inv = [];
  if (!s.notif || !Array.isArray(s.notif.reminders)) s.notif = {reminders: defaultReminders()};
  s.notif.reminders.forEach(r => { if (!r.sound) r.sound = 'tema'; if (r.vib === undefined) r.vib = true; r.cat = OLD_CAT[r.cat] || r.cat; });
  if (!s.bbSound) { s.notif.reminders.forEach(r => { if (r.sound === 'tema') r.sound = 'bb'; }); s.bbSound = true; }
  if (s.notifyRandom === undefined) s.notifyRandom = true;
  if (!s.gender) s.gender = '';
  if (s.wheelInv === undefined) s.wheelInv = true;
  if (!Array.isArray(s.wheelOff)) s.wheelOff = [];
  s.inv.forEach(i => { if (!i.added) i.added = Date.now(); });
  if (!Array.isArray(s.buys)) s.buys = [];
  if (!Array.isArray(s.mac)) s.mac = [];
  if (!Array.isArray(s.piggies)) s.piggies = [];
  if (!s.pigTime) s.pigTime = '20:00';
  if (!s.pigSound) s.pigSound = 'kumbara';
  if (s.macSkip === undefined) s.macSkip = true;
  if (!s.macTime) s.macTime = '10:00';
  if (!Array.isArray(s.wears)) s.wears = [];
  s.weather = {on: false, city: 'İstanbul', auto: false, day: '', ...(s.weather || {})};
  s.shop = {exact: true, order: ['boyner', 'beymen', 'sephora', 'trendyol', 'hepsiburada', 'amazon'], off: [], ...(s.shop || {})};
  Object.keys(STORES).forEach(k => {
    if (s.shop.order.includes(k)) return;
    // new stores slot in after Gratis rather than at the very end
    const at = s.shop.order.indexOf('gratis');
    if (k === 'perfumepoint' && at >= 0) s.shop.order.splice(at + 1, 0, k); else s.shop.order.push(k);
    if (k === 'n11' || k === 'pazarama') s.shop.off.push(k);
  });
  if (!Array.isArray(s.alarms)) s.alarms = [];
  if (!s.alarmTime) s.alarmTime = '12:00';
  s.sim = {on: true, cheap: false, ...(s.sim || {})};
  s.ui = {...UI_DEFAULT, ...(s.ui || {})};
  s.wheelCats = (s.wheelCats || []).map(c => OLD_CAT[c] || c);
  if (!s.wheelGroup) s.wheelGroup = 'Kullanım';
  if (!SKINS[s.skin]) s.skin = 'karamel';
  if (s.nobg === undefined) s.nobg = true;
  if (!s.source) s.source = 'envanter';
  if (!STORES[s.store]) s.store = 'boyner';
  s.v = 3;
  return s;
}

(async () => {
  const saved = await load();
  S = migrate(saved && Array.isArray(saved.perfumes) ? {...freshState(), ...saved} : freshState());
  applySkin(); applyUi();
  if (S.weekKey !== weekKey()) { S.weekKey = weekKey(); shuffleWeek(); }
  cleanBuys();
  repairWeek(); save(); render();
  loadBoyner();
  checkUpdate();
  ensureSounds();
  requestAnimationFrame(() => nativeCall('ready'));
  window.onNativeOpen();
  if (S.alarms.length) syncAlarms();
  weatherBoot();
  if (S.perfumes.some(p => p.cid && !p.conc)) setTimeout(() => loadCatalog().catch(() => {}), 1500);
})();
})();
</script>
