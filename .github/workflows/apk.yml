name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

# Only pushes to main by the repo owner run this; pull requests from forks never trigger it and never see secrets.
permissions:
  contents: write

concurrency: apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # third-party actions are pinned to exact commits so a hijacked tag cannot change what runs here
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.9'

      - name: Build APK (unsigned)
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          gradle -p android assembleRelease --no-daemon \
            -PWEB_URL="https://${OWNER}.github.io/${REPO}/" \
            -PVERSION_CODE=${{ github.run_number }}

      # The private key lives only in the repository's Actions secrets. It is rotated in from the old
      # (public, retired) key with APK Signature Scheme v3 so installed apps update without losing data;
      # the old key keeps no rollback right, so phones that installed a rotated build reject APKs signed only with it.
      - name: Sign APK
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          # tolerate stray spaces / line breaks from copy-paste; print only lengths, never the values
          SIGNING_KEY_PASS="$(printf '%s' "$SIGNING_KEY_PASS" | tr -d '[:space:]')"; export SIGNING_KEY_PASS
          SIGNING_KEY_B64="$(printf '%s' "$SIGNING_KEY_B64" | tr -d '[:space:]')"
          echo "secret uzunlukları: SIGNING_KEY_B64=${#SIGNING_KEY_B64} SIGNING_KEY_PASS=${#SIGNING_KEY_PASS}"
          if [ -n "$SIGNING_KEY_B64" ]; then
            if ! printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/new.p12" 2>/dev/null || [ "$(stat -c%s "$RUNNER_TEMP/new.p12")" -lt 1000 ]; then
              echo "::error::SIGNING_KEY_B64 hatalı. Bu secret'a SIGNING_KEY_B64.txt dosyasının TAMAMI (MII ile başlayan uzun metin) girilmeli."
              exit 1
            fi
            if ! keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/new.p12" -storepass:env SIGNING_KEY_PASS > "$RUNNER_TEMP/kt.log" 2>&1; then
              grep -iE "error|exception" "$RUNNER_TEMP/kt.log" | head -3 || true
              echo "::error::SIGNING_KEY_PASS hatalı ya da eksik (uzunluk ${#SIGNING_KEY_PASS}, doğrusu 32). Bu secret'a SIGNING_KEY_PASS.txt dosyasının içeriği girilmeli."
              exit 1
            fi
            "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage.bin" \
              --old-signer --ks android/keystore.p12 --ks-pass pass:parfumcarki --ks-key-alias parfum --set-rollback false \
              --new-signer --ks "$RUNNER_TEMP/new.p12" --ks-pass env:SIGNING_KEY_PASS --ks-key-alias bb
            "$BT/apksigner" sign \
              --ks android/keystore.p12 --ks-pass pass:parfumcarki --ks-key-alias parfum \
              --next-signer --ks "$RUNNER_TEMP/new.p12" --ks-pass env:SIGNING_KEY_PASS --ks-key-alias bb \
              --lineage "$RUNNER_TEMP/lineage.bin" --out parfum-carki.apk aligned.apk
            rm -f "$RUNNER_TEMP/new.p12"
          else
            echo "::warning::SIGNING_KEY_B64 secret bulunamadı; APK eski (herkese açık) anahtarla imzalandı."
            "$BT/apksigner" sign --ks android/keystore.p12 --ks-pass pass:parfumcarki --ks-key-alias parfum --out parfum-carki.apk aligned.apk
          fi
          "$BT/apksigner" verify --print-certs parfum-carki.apk | grep -E "Signer|SHA-256" || true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ github.run_number }}
          name: BB Parfüm Envanteri v${{ github.run_number }}
          body: Telefonda uygulamanın içindeki "Şimdi güncelle" ile ya da bu dosyayı indirip kur.
          files: parfum-carki.apk
          make_latest: true
