plugins {
    id 'com.android.application'
}

def webUrl = project.findProperty('WEB_URL') ?: 'https://example.github.io/parfum-carki/'
def vCode = (project.findProperty('VERSION_CODE') ?: '1') as Integer

android {
    namespace 'com.parfumcarki.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.parfumcarki.app'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName "1.${vCode}"
        buildConfigField 'String', 'WEB_URL', "\"${webUrl}\""
    }

    buildFeatures { buildConfig true }


    buildTypes {
        release {
            minifyEnabled false
            // signed in CI with apksigner (see .github/workflows/apk.yml); no keys or passwords live here
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
