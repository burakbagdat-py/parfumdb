plugins {
    id 'com.android.application'
}

def webUrl = project.findProperty('WEB_URL') ?: 'https://example.github.io/parfum-carki/'
def vCode = (project.findProperty('VERSION_CODE') ?: '1') as Integer

android {
    namespace 'com.parfumcarki.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.parfumcarki.app'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName "1.${vCode}"
        buildConfigField 'String', 'WEB_URL', "\"${webUrl}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            storeFile file('../keystore.p12')
            storeType 'pkcs12'
            storePassword 'parfumcarki'
            keyAlias 'parfum'
            keyPassword 'parfumcarki'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
